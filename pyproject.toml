[tool.poetry]
name = "ml-benchmark"
version = "0.1.0"
description = ""
authors = ["Pablo Alfaro <ludecan@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "3.10.16"
numpy = "1.26.4"
pandas = "^2.2.3"
scikit-learn = "1.5.2"
xgboost = "^2.1.3"
lightgbm = "^4.5.0"
pytorch-tabnet = "^4.1.0"
rich = "^13.4.0"
scikit-learn-extra = "^0.3.0"
tensorflow = "^2.18.0"
tensorflow-decision-forests = "^1.11.0"
black = "^23.3.0"
tabpfn = "^2.0.3"
tabpfn-extensions = {git = "https://github.com/PriorLabs/tabpfn-extensions.git"}
autogluon-tabular = {version = "1.2.0", extras = ["all", "imodels", "vowpalwabbit"]}


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.23.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
